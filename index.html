<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Furigana Tool</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg-primary: #0f1117;
      --bg-secondary: #161b22;
      --bg-input: #0d1117;
      --border: #21262d;
      --border-active: #1f6feb;
      --text-primary: #e6edf3;
      --text-secondary: #8b949e;
      --text-muted: #484f58;
      --accent: #1f6feb;
      --accent-glow: #1f6feb15;
      --error: #f85149;
      --error-bg: #da363415;
      --error-border: #da363444;
      --success: #3fb950;
      --success-bg: #23862615;
      --success-border: #238636;
      --amber: #d29922;
      --amber-bg: #d2992215;
      --amber-border: #d2992244;
      --font-mono: 'JetBrains Mono', 'SF Mono', 'Fira Code', monospace;
      --font-jp: 'Noto Sans JP', 'Hiragino Sans', sans-serif;
    }

    body {
      min-height: 100vh;
      background: var(--bg-primary);
      color: var(--text-secondary);
      font-family: var(--font-mono);
    }

    textarea:focus, button:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    textarea::placeholder { color: var(--text-muted); }
    textarea { font-family: var(--font-jp), var(--font-mono); }

    @keyframes shimmer {
      0% { background-position: -200% 0; }
      100% { background-position: 200% 0; }
    }

    .header {
      border-bottom: 1px solid var(--border);
      padding: 20px 24px;
      background: linear-gradient(180deg, var(--bg-secondary) 0%, var(--bg-primary) 100%);
    }
    .header-inner {
      max-width: 960px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .header-icon { font-size: 24px; }
    .header h1 { font-size: 18px; font-weight: 600; color: var(--text-primary); letter-spacing: -0.02em; }
    .header p { font-size: 12px; color: var(--text-muted); margin-top: 2px; }

    .container { max-width: 960px; margin: 0 auto; padding: 24px 24px 48px; }

    /* Setup Banner */
    .setup-banner {
      padding: 16px 20px;
      background: var(--error-bg);
      border: 1px solid var(--error-border);
      border-radius: 8px;
      margin-bottom: 24px;
    }
    .setup-banner.connected { background: var(--success-bg); border-color: var(--success-border); }
    .setup-banner label {
      font-size: 12px; font-weight: 600; color: var(--text-secondary);
      text-transform: uppercase; letter-spacing: 0.05em; display: block; margin-bottom: 8px;
    }
    .setup-row { display: flex; gap: 8px; }
    .setup-row input {
      flex: 1; padding: 8px 12px; background: var(--bg-input);
      border: 1px solid var(--border); border-radius: 6px;
      color: var(--text-primary); font-family: var(--font-mono); font-size: 13px;
    }
    .setup-row input:focus { outline: 2px solid var(--accent); outline-offset: 2px; }
    .setup-row button, .settings-row button {
      padding: 8px 16px; background: var(--bg-secondary);
      border: 1px solid var(--border); border-radius: 6px;
      color: var(--text-secondary); font-family: var(--font-mono);
      font-size: 12px; font-weight: 600; cursor: pointer;
      white-space: nowrap; transition: all 0.15s;
    }
    .setup-row button:hover, .settings-row button:hover { border-color: var(--accent); color: var(--accent); }
    .setup-status { font-size: 11px; margin-top: 8px; }
    .setup-status.ok { color: var(--success); }
    .setup-status.err { color: var(--error); }

    /* Model Toggle + Controls Row */
    .controls-row {
      display: flex; align-items: center; gap: 16px;
      margin-bottom: 24px; flex-wrap: wrap;
    }
    .model-toggle {
      display: flex; border: 1px solid var(--border); border-radius: 6px; overflow: hidden;
    }
    .model-toggle button {
      padding: 8px 16px; background: var(--bg-secondary);
      border: none; border-right: 1px solid var(--border);
      color: var(--text-muted); font-family: var(--font-mono);
      font-size: 12px; font-weight: 600; cursor: pointer; transition: all 0.15s;
    }
    .model-toggle button:last-child { border-right: none; }
    .model-toggle button.active { background: var(--accent-glow); color: #58a6ff; }
    .model-toggle button:hover:not(.active) { color: var(--text-secondary); }
    .model-cost {
      font-size: 11px; color: var(--text-muted); padding: 4px 8px;
      background: var(--bg-secondary); border-radius: 4px;
    }

    /* Mode Selector */
    .modes { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 24px; }
    @media (max-width: 640px) { .modes { grid-template-columns: repeat(2, 1fr); } }
    .mode-btn {
      padding: 12px 8px; background: var(--bg-secondary);
      border: 1px solid var(--border); border-radius: 8px;
      cursor: pointer; text-align: center; color: var(--text-secondary); transition: all 0.15s;
    }
    .mode-btn:hover { transform: translateY(-1px); border-color: var(--text-muted); }
    .mode-btn:active { transform: translateY(0); }
    .mode-btn.active { background: var(--accent-glow); border-color: var(--accent); color: #58a6ff; }
    .mode-btn .icon { font-size: 20px; margin-bottom: 4px; }
    .mode-btn .label { font-size: 11px; font-weight: 600; line-height: 1.3; }
    .mode-btn .desc { font-size: 10px; margin-top: 4px; color: var(--text-muted); }
    .mode-btn.active .desc { color: #58a6ff88; }

    /* Sections */
    .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .section-label {
      font-size: 12px; font-weight: 600; color: var(--text-secondary);
      text-transform: uppercase; letter-spacing: 0.05em;
    }
    .section-meta { font-size: 11px; color: var(--text-muted); }

    .input-area {
      width: 100%; height: 260px; background: var(--bg-input);
      border: 1px solid var(--border); border-radius: 8px;
      padding: 16px; color: var(--text-primary); font-size: 13px;
      line-height: 1.7; resize: vertical;
    }

    .process-btn {
      width: 100%; padding: 12px 20px; background: var(--accent);
      border: none; border-radius: 8px; color: #fff;
      font-size: 14px; font-weight: 600; font-family: var(--font-mono);
      cursor: pointer; margin: 16px 0 24px; transition: background 0.2s;
    }
    .process-btn:disabled { background: var(--border); color: var(--text-muted); cursor: default; }
    .process-btn.loading {
      background: linear-gradient(90deg, #1f6feb33, #1f6feb66, #1f6feb33);
      background-size: 200% 100%; animation: shimmer 1.5s infinite linear; color: #fff;
    }

    .error-box {
      padding: 12px 16px; background: var(--error-bg);
      border: 1px solid var(--error-border); border-radius: 8px;
      color: var(--error); font-size: 13px; margin-bottom: 16px;
    }

    .output-box {
      width: 100%; min-height: 200px; max-height: 500px; overflow-y: auto;
      background: var(--bg-input); border: 1px solid var(--border); border-radius: 8px;
      padding: 16px; color: var(--text-primary); font-size: 13px; line-height: 1.7;
      white-space: pre-wrap; word-break: break-word;
      font-family: var(--font-jp), var(--font-mono);
    }

    .copy-btn {
      padding: 4px 12px; background: var(--border); border: 1px solid #30363d;
      border-radius: 6px; color: var(--text-secondary); font-size: 12px;
      font-family: var(--font-mono); cursor: pointer; transition: all 0.15s;
    }
    .copy-btn:hover { border-color: var(--accent); color: var(--accent); }
    .copy-btn.copied { background: var(--success-bg); border-color: var(--success-border); color: var(--success); }

    .preview-box {
      width: 100%; min-height: 100px; background: var(--bg-secondary);
      border: 1px solid var(--border); border-radius: 8px;
      padding: 16px; color: var(--text-primary); font-size: 15px;
      line-height: 2.2; font-family: var(--font-jp), sans-serif; margin-top: 16px;
    }
    .preview-box rt { font-size: 0.6em; color: #58a6ff; }

    /* Corrections Summary */
    .corrections-box {
      margin-top: 16px; padding: 16px; border-radius: 8px;
      font-size: 13px; line-height: 1.7;
      font-family: var(--font-jp), var(--font-mono);
      white-space: pre-wrap;
    }
    .corrections-box.has-changes {
      background: var(--amber-bg); border: 1px solid var(--amber-border); color: var(--amber);
    }
    .corrections-box.no-changes {
      background: var(--success-bg); border: 1px solid var(--success-border); color: var(--success);
    }
    .corrections-box .corrections-label {
      font-size: 12px; font-weight: 600; text-transform: uppercase;
      letter-spacing: 0.05em; margin-bottom: 8px; display: block;
    }

    /* History Section */
    .history-section { margin-top: 40px; border-top: 1px solid var(--border); padding-top: 24px; }
    .history-item {
      background: var(--bg-secondary); border: 1px solid var(--border);
      border-radius: 8px; padding: 16px; margin-bottom: 12px;
    }
    .history-header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 12px; flex-wrap: wrap; gap: 8px;
    }
    .history-meta { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .history-tag {
      font-size: 10px; font-weight: 600; padding: 2px 8px;
      border-radius: 4px; text-transform: uppercase; letter-spacing: 0.05em;
    }
    .history-tag.mode { background: var(--accent-glow); color: #58a6ff; border: 1px solid #1f6feb44; }
    .history-tag.model { background: var(--bg-primary); color: var(--text-muted); border: 1px solid var(--border); }
    .history-tag.tokens { background: var(--amber-bg); color: var(--amber); border: 1px solid var(--amber-border); }
    .history-time { font-size: 11px; color: var(--text-muted); }
    .history-output {
      max-height: 150px; overflow-y: auto; background: var(--bg-input);
      border: 1px solid var(--border); border-radius: 6px;
      padding: 12px; font-size: 12px; line-height: 1.6;
      white-space: pre-wrap; word-break: break-word; color: var(--text-primary);
      font-family: var(--font-jp), var(--font-mono);
    }
    .history-actions { display: flex; gap: 8px; margin-top: 10px; }
  </style>
</head>
<body>

  <div class="header">
    <div class="header-inner">
      <span class="header-icon">振</span>
      <div>
        <h1>Furigana Tool</h1>
        <p>Add & review ruby tags · Powered by Claude</p>
      </div>
    </div>
  </div>

  <div class="container">

    <!-- Worker URL Setup -->
    <div class="setup-banner" id="setupBanner">
      <label>Worker URL</label>
      <div class="setup-row">
        <input type="text" id="workerUrl" placeholder="https://your-worker-name.your-subdomain.workers.dev">
        <button onclick="saveWorkerUrl()">Save</button>
      </div>
      <div class="setup-status" id="setupStatus"></div>
    </div>

    <!-- Model Toggle -->
    <div class="controls-row">
      <div class="model-toggle" id="modelToggle">
        <button onclick="setModel('claude-haiku-4-5-20251001')" id="btn-haiku">Haiku</button>
        <button onclick="setModel('claude-sonnet-4-6')" id="btn-sonnet" class="active">Sonnet</button>
      </div>
      <span class="model-cost" id="modelCost">~$3 / $15 per MTok</span>
    </div>

    <!-- Mode Selector -->
    <div class="modes" id="modeSelector"></div>

    <!-- Input -->
    <div>
      <div class="section-header">
        <span class="section-label" id="inputLabel">Input</span>
        <span class="section-meta" id="inputMeta"></span>
      </div>
      <textarea class="input-area" id="inputArea" placeholder="Paste your content here..."></textarea>
    </div>

    <!-- Process Button -->
    <button class="process-btn" id="processBtn" disabled onclick="processContent()">Add Ruby Tags</button>

    <!-- Error -->
    <div class="error-box" id="errorBox" style="display:none"></div>

    <!-- Output -->
    <div id="outputSection" style="display:none">
      <div class="section-header">
        <span class="section-label">Output</span>
        <div style="display:flex; align-items:center; gap:12px">
          <span class="section-meta" id="tokenInfo"></span>
          <button class="copy-btn" id="copyBtn" onclick="copyOutput()">Copy</button>
        </div>
      </div>
      <div class="output-box" id="outputBox"></div>
      <div style="margin-top:16px">
        <span class="section-label" style="display:block; margin-bottom:8px">Preview</span>
        <div class="preview-box" id="previewBox"></div>
      </div>
      <!-- Corrections Summary (review modes only) -->
      <div class="corrections-box" id="correctionsBox" style="display:none">
        <span class="corrections-label">Corrections Summary</span>
        <span id="correctionsContent"></span>
      </div>
    </div>

    <!-- History -->
    <div class="history-section" id="historySection" style="display:none">
      <div class="section-header">
        <span class="section-label">Recent Outputs</span>
        <button class="copy-btn" onclick="clearHistory()">Clear</button>
      </div>
      <div id="historyList"></div>
    </div>
  </div>

<script>
// ============================================================
// State
// ============================================================
let currentMode = 'md-full';
let currentModel = localStorage.getItem('furigana_model') || 'claude-sonnet-4-6';
let workerUrl = localStorage.getItem('furigana_worker_url') || '';
let outputText = '';
let history = JSON.parse(localStorage.getItem('furigana_history') || '[]');

const MODEL_INFO = {
  'claude-haiku-4-5-20251001': { label: 'Haiku', cost: '~$1 / $5 per MTok', btnId: 'btn-haiku' },
  'claude-sonnet-4-6': { label: 'Sonnet', cost: '~$3 / $15 per MTok', btnId: 'btn-sonnet' },
};

const MODES = [
  { id: 'md-full',     label: 'Markdown — Add Ruby',  desc: 'Add furigana ruby tags to all kanji', icon: '📝' },
  { id: 'html-full',   label: 'HTML — Add Ruby',      desc: 'Add furigana ruby tags to all kanji', icon: '🌐' },
  { id: 'md-review',   label: 'Markdown — Review',    desc: 'Review & correct existing ruby tags', icon: '🔍' },
  { id: 'html-review', label: 'HTML — Review',        desc: 'Review & correct existing ruby tags', icon: '🔎' },
];

const SYSTEM_PROMPTS = {
  "md-full": `You are a Japanese language expert. Add <ruby> furigana tags to ALL kanji in the provided Markdown content.

CRITICAL RULES — PRESERVATION:
- Line breaks: Preserve EVERY line break exactly. Each line in the input must appear on its own line in the output. Do NOT merge lines. Do NOT collapse headers onto other lines.
- Markdown structure: Preserve all #, ##, ###, |, ---, !, [], (), >, !!!, and other Markdown syntax exactly as-is.
- English text: Do NOT add ruby tags to English or romaji text. Only tag Japanese kanji.
- Code blocks and inline code: Do NOT modify content inside fenced code blocks or inline code.
- Link URLs: Do NOT modify URLs inside [text](url) or reference links.
- HTML comments: Do NOT modify any HTML comment blocks.
- Existing ruby tags: Do NOT modify any existing <ruby> tags.

RUBY TAG RULES:
- Wrap every kanji with <ruby>kanji<rt>reading</rt></ruby>
- Use compound readings for jukujikun: 今日→<ruby>今日<rt>きょう</rt></ruby>, 昨日→<ruby>昨日<rt>きのう</rt></ruby>, 大人→<ruby>大人<rt>おとな</rt></ruby>
- For mixed kanji+kana words, only wrap the kanji portions: 食べる→<ruby>食<rt>た</rt></ruby>べる
- 私 should be read as わたし (not わたくし) unless explicitly in a very formal/keigo context
- 君 should be read as きみ when used as a pronoun, くん only when used as a name suffix (〜君)
- Choose readings based on context (e.g. 開く: あく for intransitive, ひらく for transitive)
- If a word is already written in kana (e.g. ください, ちょっと), leave it in kana. Do NOT convert kana to kanji.
- Do NOT add ruby tags to single kana characters like お or ご when used as honorific prefixes — leave them as-is.

Output ONLY the processed content. No explanations, no commentary.`,

  "html-full": `You are a Japanese language expert. Add <ruby> furigana tags to ALL kanji in the provided HTML content.

CRITICAL RULES — PRESERVATION:
- Line breaks: Preserve EVERY line break exactly. Do NOT merge or collapse lines.
- HTML structure: Preserve all tags, attributes, and nesting exactly as-is.
- English text: Do NOT add ruby tags to English or romaji text. Only tag Japanese kanji.
- DO NOT modify content inside <pre>, <code>, <script>, <style>, or <textarea> elements.
- DO NOT modify HTML comments.
- DO NOT modify HTML attributes or tag structure.
- DO NOT modify any existing <ruby> tags (both formats with and without <rp> tags).

RUBY TAG RULES:
- Wrap every kanji with <ruby>kanji<rt>reading</rt></ruby>
- Use compound readings for jukujikun: 今日→<ruby>今日<rt>きょう</rt></ruby>, 昨日→<ruby>昨日<rt>きのう</rt></ruby>, 大人→<ruby>大人<rt>おとな</rt></ruby>
- For mixed kanji+kana words, only wrap the kanji portions: 食べる→<ruby>食<rt>た</rt></ruby>べる
- 私 should be read as わたし (not わたくし) unless explicitly in a very formal/keigo context
- 君 should be read as きみ when used as a pronoun, くん only when used as a name suffix (〜君)
- Choose readings based on context (e.g. 開く: あく for intransitive, ひらく for transitive)
- If a word is already written in kana (e.g. ください, ちょっと), leave it in kana. Do NOT convert kana to kanji.
- Do NOT add ruby tags to single kana characters like お or ご when used as honorific prefixes — leave them as-is.

Output ONLY the processed content. No explanations, no commentary.`,

  "md-review": `You are a Japanese language expert reviewing Markdown content that already has <ruby> furigana tags. Your job is to find and fix INCORRECT readings.

CRITICAL RULES — PRESERVATION:
- Line breaks: Preserve EVERY line break exactly. Each line in the input must appear on its own line in the output. Do NOT merge lines.
- Markdown structure: Preserve all #, ##, ###, |, ---, !, [], (), >, !!!, and other Markdown syntax exactly.
- DO NOT modify content inside code blocks, inline code, link URLs, or HTML comments.
- If a word is already written in kana (e.g. ください), leave it in kana. Do NOT convert kana to kanji.

REVIEW RULES:
- Check every existing <ruby>kanji<rt>reading</rt></ruby> tag for correctness
- Fix incorrect readings based on context
- Common errors to watch for:
  - 私 tagged as わたくし should usually be わたし
  - 君 tagged as くん should often be きみ (when used as pronoun)
  - 開く readings (あく vs ひらく) based on transitive/intransitive context
  - Compound words with wrong per-character readings that should be compound readings
- Also add ruby tags to any kanji that were MISSED (not tagged at all)
- DO NOT modify correctly-tagged kanji

Output format:
1. First, output the COMPLETE corrected content (do NOT include YAML front matter — it is handled separately)
2. Then add a separator line: ===CORRECTIONS===
3. After the separator, list each correction as: original → corrected (reason)
4. If any kanji were missing ruby tags, list them as: ADDED: kanji (reading)
5. If there are NO corrections or additions needed, write: ===CORRECTIONS===\\nNo changes needed. All ruby tags are correct.`,

  "html-review": `You are a Japanese language expert reviewing HTML content that already has <ruby> furigana tags. Your job is to find and fix INCORRECT readings.

CRITICAL RULES — PRESERVATION:
- Line breaks: Preserve EVERY line break exactly. Do NOT merge or collapse lines.
- HTML structure: Preserve all tags, attributes, and nesting exactly as-is.
- DO NOT modify content inside <pre>, <code>, <script>, <style>, or <textarea> elements.
- DO NOT modify HTML comments or attributes.
- If a word is already written in kana (e.g. ください), leave it in kana. Do NOT convert kana to kanji.

REVIEW RULES:
- Check every existing <ruby>kanji<rt>reading</rt></ruby> tag for correctness (both with and without <rp> tags)
- Fix incorrect readings based on context
- Common errors to watch for:
  - 私 tagged as わたくし should usually be わたし
  - 君 tagged as くん should often be きみ (when used as pronoun)
  - 開く readings (あく vs ひらく) based on transitive/intransitive context
  - Compound words with wrong per-character readings that should be compound readings
- Also add ruby tags to any kanji that were MISSED (not tagged at all)
- DO NOT modify correctly-tagged kanji

Output format:
1. First, output the COMPLETE corrected content exactly
2. Then add a separator line: ===CORRECTIONS===
3. After the separator, list each correction as: original → corrected (reason)
4. If any kanji were missing ruby tags, list them as: ADDED: kanji (reading)
5. If there are NO corrections or additions needed, write: ===CORRECTIONS===\\nNo changes needed. All ruby tags are correct.`,
};

// ============================================================
// Init
// ============================================================
function init() {
  renderModes();
  updateModelToggle();
  updateSetupBanner();
  updateButtonState();
  renderHistory();

  document.getElementById('inputArea').addEventListener('input', () => {
    const len = document.getElementById('inputArea').value.length;
    document.getElementById('inputMeta').textContent = len > 0 ? `${len} chars` : '';
    updateButtonState();
  });
}

function renderModes() {
  const container = document.getElementById('modeSelector');
  container.innerHTML = MODES.map(m => `
    <button class="mode-btn ${m.id === currentMode ? 'active' : ''}"
            onclick="setMode('${m.id}')">
      <div class="icon">${m.icon}</div>
      <div class="label">${m.label}</div>
      <div class="desc">${m.desc}</div>
    </button>
  `).join('');
}

function setMode(id) {
  currentMode = id;
  renderModes();
  const isReview = id.includes('review');
  document.getElementById('inputArea').placeholder = isReview
    ? 'Paste content with existing ruby tags to review...'
    : 'Paste your Markdown or HTML content here...';
  document.getElementById('processBtn').textContent = isReview ? 'Review & Correct' : 'Add Ruby Tags';
  document.getElementById('inputLabel').textContent = `Input · ${MODES.find(m => m.id === id).label}`;
}

// ============================================================
// Model Toggle
// ============================================================
function setModel(model) {
  currentModel = model;
  localStorage.setItem('furigana_model', model);
  updateModelToggle();
}

function updateModelToggle() {
  document.getElementById('btn-haiku').classList.toggle('active', currentModel === 'claude-haiku-4-5-20251001');
  document.getElementById('btn-sonnet').classList.toggle('active', currentModel === 'claude-sonnet-4-6');
  document.getElementById('modelCost').textContent = MODEL_INFO[currentModel]?.cost || '';
}

// ============================================================
// Worker URL
// ============================================================
function saveWorkerUrl() {
  let url = document.getElementById('workerUrl').value.trim();
  if (url.endsWith('/')) url = url.slice(0, -1);
  workerUrl = url;
  localStorage.setItem('furigana_worker_url', url);
  updateSetupBanner();
  updateButtonState();
  if (url) {
    document.getElementById('setupStatus').textContent = '✓ Saved';
    document.getElementById('setupStatus').className = 'setup-status ok';
  }
}

function updateSetupBanner() {
  const banner = document.getElementById('setupBanner');
  document.getElementById('workerUrl').value = workerUrl;
  if (workerUrl) {
    banner.className = 'setup-banner connected';
    document.getElementById('setupStatus').textContent = '✓ Connected';
    document.getElementById('setupStatus').className = 'setup-status ok';
  } else {
    banner.className = 'setup-banner';
    document.getElementById('setupStatus').textContent = 'Enter your Cloudflare Worker URL to get started';
    document.getElementById('setupStatus').className = 'setup-status';
  }
}

function updateButtonState() {
  document.getElementById('processBtn').disabled =
    !workerUrl || !document.getElementById('inputArea').value.trim();
}

// ============================================================
// Process
// ============================================================

// Extract YAML front matter from content, return { frontMatter, body }
function extractFrontMatter(text) {
  const match = text.match(/^(---\n[\s\S]*?\n---)\n?([\s\S]*)$/);
  if (match) {
    return { frontMatter: match[1], body: match[2] };
  }
  return { frontMatter: '', body: text };
}

async function processContent() {
  const input = document.getElementById('inputArea').value.trim();
  if (!input || !workerUrl) return;

  const btn = document.getElementById('processBtn');
  const errorBox = document.getElementById('errorBox');
  const outputSection = document.getElementById('outputSection');

  btn.disabled = true;
  btn.classList.add('loading');
  btn.textContent = 'Processing...';
  errorBox.style.display = 'none';
  outputSection.style.display = 'none';

  try {
    // For Markdown modes, strip front matter before sending to API
    const isMd = currentMode.startsWith('md-');
    const { frontMatter, body } = isMd ? extractFrontMatter(input) : { frontMatter: '', body: input };
    const contentToSend = isMd && frontMatter ? body : input;

    const response = await fetch(workerUrl, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: currentModel,
        max_tokens: 16000,
        system: SYSTEM_PROMPTS[currentMode],
        messages: [{ role: 'user', content: contentToSend }],
      }),
    });

    const data = await response.json();

    if (data.error) {
      throw new Error(data.error.message || JSON.stringify(data.error));
    }

    outputText = (data.content || [])
      .filter(b => b.type === 'text')
      .map(b => b.text)
      .join('\n');

    if (!outputText) throw new Error('No output returned from API');

    // Parse corrections summary if in review mode
    let corrections = '';
    const isReview = currentMode.includes('review');
    const separator = '===CORRECTIONS===';

    if (isReview && outputText.includes(separator)) {
      const parts = outputText.split(separator);
      outputText = parts[0].trimEnd();
      corrections = parts[1].trim();
    }

    // If the API output starts with front matter (model didn't follow instructions),
    // strip it so we don't get a mangled version
    if (isMd && frontMatter) {
      const apiFm = outputText.match(/^---\n[\s\S]*?\n---\n?/);
      if (apiFm) {
        outputText = outputText.slice(apiFm[0].length);
      }
    }

    // Rebuild with original front matter for Markdown modes
    if (isMd && frontMatter) {
      let fmToUse = frontMatter;

      // For review modes, inject "reviewed" field
      if (isReview) {
        const modelLabel = MODEL_INFO[currentModel]?.label || currentModel;
        const now = new Date();
        const y = now.getFullYear();
        const m = String(now.getMonth() + 1).padStart(2, '0');
        const d = String(now.getDate()).padStart(2, '0');
        const reviewedLine = `reviewed: "${modelLabel} - Reviewed ${y}・${m}・${d}"`;

        // Extract inner content of front matter
        const fmInner = fmToUse.match(/^---\n([\s\S]*?)\n---$/);
        if (fmInner) {
          let fmContent = fmInner[1];
          if (/^reviewed:/m.test(fmContent)) {
            fmContent = fmContent.replace(/^reviewed:.*$/m, reviewedLine);
          } else {
            fmContent = fmContent.trimEnd() + '\n' + reviewedLine;
          }
          fmToUse = '---\n' + fmContent + '\n---';
        }
      }

      outputText = fmToUse + '\n' + outputText;
    }

    // Show output
    document.getElementById('outputBox').textContent = outputText;
    document.getElementById('previewBox').innerHTML = outputText;
    outputSection.style.display = 'block';

    // Show corrections summary
    const correctionsBox = document.getElementById('correctionsBox');
    if (isReview && corrections) {
      const noChanges = corrections.toLowerCase().includes('no changes needed');
      correctionsBox.className = 'corrections-box ' + (noChanges ? 'no-changes' : 'has-changes');
      document.getElementById('correctionsContent').textContent = corrections;
      correctionsBox.style.display = 'block';
    } else {
      correctionsBox.style.display = 'none';
    }

    // Token info
    let totalTokens = 0;
    if (data.usage) {
      totalTokens = (data.usage.input_tokens || 0) + (data.usage.output_tokens || 0);
      document.getElementById('tokenInfo').textContent = `${totalTokens.toLocaleString()} tokens`;
    }

    // Save to history (keep last 2)
    addToHistory({
      mode: currentMode,
      model: currentModel,
      output: outputText,
      tokens: totalTokens,
      timestamp: new Date().toISOString(),
    });

  } catch (err) {
    errorBox.textContent = err.message;
    errorBox.style.display = 'block';
  } finally {
    btn.disabled = false;
    btn.classList.remove('loading');
    btn.textContent = currentMode.includes('review') ? 'Review & Correct' : 'Add Ruby Tags';
    updateButtonState();
  }
}

// ============================================================
// History
// ============================================================
function addToHistory(entry) {
  history.unshift(entry);
  if (history.length > 2) history = history.slice(0, 2);
  localStorage.setItem('furigana_history', JSON.stringify(history));
  renderHistory();
}

function clearHistory() {
  history = [];
  localStorage.setItem('furigana_history', '[]');
  renderHistory();
}

function copyHistoryItem(index) {
  if (!history[index]) return;
  navigator.clipboard.writeText(history[index].output);
  const btn = document.getElementById(`histCopy${index}`);
  btn.textContent = '✓ Copied';
  btn.classList.add('copied');
  setTimeout(() => { btn.textContent = 'Copy'; btn.classList.remove('copied'); }, 2000);
}

function loadHistoryItem(index) {
  if (!history[index]) return;
  outputText = history[index].output;
  document.getElementById('outputBox').textContent = outputText;
  document.getElementById('previewBox').innerHTML = outputText;
  document.getElementById('outputSection').style.display = 'block';
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function renderHistory() {
  const section = document.getElementById('historySection');
  const list = document.getElementById('historyList');

  if (history.length === 0) {
    section.style.display = 'none';
    return;
  }

  section.style.display = 'block';
  list.innerHTML = history.map((h, i) => {
    const modeLabel = MODES.find(m => m.id === h.mode)?.label || h.mode;
    const modelLabel = MODEL_INFO[h.model]?.label || h.model;
    const time = new Date(h.timestamp);
    const timeStr = time.toLocaleDateString() + ' ' + time.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    const preview = h.output.substring(0, 200).replace(/</g, '&lt;') + (h.output.length > 200 ? '...' : '');

    return `
      <div class="history-item">
        <div class="history-header">
          <div class="history-meta">
            <span class="history-tag mode">${modeLabel}</span>
            <span class="history-tag model">${modelLabel}</span>
            ${h.tokens ? `<span class="history-tag tokens">${h.tokens.toLocaleString()} tokens</span>` : ''}
          </div>
          <span class="history-time">${timeStr}</span>
        </div>
        <div class="history-output">${preview}</div>
        <div class="history-actions">
          <button class="copy-btn" id="histCopy${i}" onclick="copyHistoryItem(${i})">Copy</button>
          <button class="copy-btn" onclick="loadHistoryItem(${i})">Load to Output</button>
        </div>
      </div>
    `;
  }).join('');
}

// ============================================================
// Copy current output
// ============================================================
function copyOutput() {
  if (!outputText) return;
  navigator.clipboard.writeText(outputText);
  const btn = document.getElementById('copyBtn');
  btn.textContent = '✓ Copied';
  btn.classList.add('copied');
  setTimeout(() => { btn.textContent = 'Copy'; btn.classList.remove('copied'); }, 2000);
}

// ============================================================
// Start
// ============================================================
init();
</script>
