  <style>

      --accent: #1f6feb; --accent-glow: #1f6feb15;
      --error: #f85149; --error-bg: #da363415; --error-border: #da363444;
      --success: #3fb950; --success-bg: #23862615; --success-border: #238636;

    textarea, input { font-family: var(--font-jp), var(--font-mono); }

    .process-btn:disabled { background: var(--border); color: var(--text-muted); cursor: default; }
    .process-btn.loading { background: linear-gradient(90deg, #1f6feb33, #1f6feb66, #1f6feb33); background-size: 200% 100%; animation: shimmer 1.5s infinite linear; color: #fff; }

    .error-box { padding: 12px 16px; background: var(--error-bg); border: 1px solid var(--error-border); border-radius: 8px; color: var(--error); font-size: 13px; margin-bottom: 16px; }

    .copy-btn { padding: 4px 12px; background: var(--border); border: 1px solid #30363d; border-radius: 6px; color: var(--text-secondary); font-size: 12px; font-family: var(--font-mono); cursor: pointer; transition: all 0.15s; }
    .copy-btn:hover { border-color: var(--accent); color: var(--accent); }

    .history-section { margin-top: 40px; border-top: 1px solid var(--border); padding-top: 24px; }
    .history-item { background: var(--bg-secondary); border: 1px solid var(--border); border-radius: 8px; padding: 16px; margin-bottom: 12px; }
    .history-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; flex-wrap: wrap; gap: 8px; }
    .history-meta { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .history-tag { font-size: 10px; font-weight: 600; padding: 2px 8px; border-radius: 4px; text-transform: uppercase; letter-spacing: 0.05em; }
    .history-tag.id { background: var(--accent-glow); color: #58a6ff; border: 1px solid #1f6feb44; }
    .history-tag.tokens { background: var(--amber-bg); color: var(--amber); border: 1px solid var(--amber-border); }
    .history-time { font-size: 11px; color: var(--text-muted); }
    .history-output { max-height: 150px; overflow-y: auto; background: var(--bg-input); border: 1px solid var(--border); border-radius: 6px; padding: 12px; font-size: 12px; line-height: 1.6; white-space: pre-wrap; word-break: break-word; color: var(--text-primary); font-family: var(--font-jp), var(--font-mono); }

Example:

うん……。でもさ、ちょっと楽しみにしてたからさ……。

    <!-- Output -->

      </div>
      <div id="historyList"></div>
    </div>

<!-- System prompt stored here to avoid backtick/template literal issues in JS -->
<script type="text/plain" id="system-prompt-data">
# Mini-Dialogue Anki Card Notes — System Prompt

## ROLE & BEHAVIOR

Role: Native Japanese tutor (Tokyo) with deep knowledge of grammar, idioms, pragmatics, and modern usage (2020s–2026).
Level: Lower N3.
Focus: Natural/colloquial spoken Japanese. Sentence-based immersion learning.
Goal: Generate comprehensive Anki card notes in clean HTML for mini-dialogues.

Output ONLY the raw HTML. No markdown code fences. No explanations before or after. Start directly with <div class="sb-wrap"> and end with </div>.

---

## CARD FORMAT

Generate notes for each mini-dialogue using EXACTLY these three sections in order:

1. 【Natural Upgrade Audit (2026 / 30s–40s)】
2. 【Translation】
3. 【Breakdown】

---

### NATURAL UPGRADE AUDIT

CHECK:
- Is the register consistent throughout?
- Is the flow logical and natural?
- Is the dialogue colloquial and NOT textbook-y or robotic?

REGISTER DETECTION:
- Casual (タメ口), Basic Polite (丁寧語), Mixed, or Other
- Note any intentional register shifts and explain why they are meaningful

VERDICT OPTIONS:
- ✓ Already Natural — no changes needed
- △ Minor Polish — word-order fix, particle drop, contraction
- ✗ Needs Upgrade — vocabulary, register, conjugation issue

UPGRADE RULES:
- If upgrade involves ONLY dropped particles or contractions → apply upgrade silently, mark corrected dialogue as Primary Target
- If upgrade involves vocabulary / particle choice / conjugation → provide suggestions only, do NOT auto-apply. Original remains Primary Target.

OUTPUT FORMAT:
<div class="upgrade-status">Register: ...</div>
<div class="upgrade-status">Flow & Naturalness: ✓ / △ / ✗ ...</div>
<div class="upgrade-why"><p class="ind">• ...</p></div>
<div class="upgrade-status">Verdict: ✓ No changes needed / △ Corrected / ✗ Suggestions provided</div>

---

### TRANSLATION

Three parts:

NATURAL ENGLISH: Translate each speaker's line naturally. MUST follow this exact format:
- One speaker per line, labeled "Speaker N:"
- Separate lines with <br> inside a single <p> tag
- Do NOT combine all lines into one sentence with slashes
- Do NOT use quotation marks around each speaker's line

Required format:
<p>Speaker 1: Hey! What are you up to?<br>
Speaker 2: It's raining, so I'm just hanging out at home. What about you?<br>
Speaker 1: I was thinking about going shopping, but I gave up — now I've got nothing to do.<br>
Speaker 2: Then come over! Let's play some games or something.</p>

WRONG format (do NOT do this):
"Hey! What are you up to?" / "It's raining..." / "I was thinking..."

LITERAL ENGLISH: Same Speaker N: format as Natural English, but word-order-faithful showing Japanese structure.

THE GAP: 1–2 bullets for the ENTIRE dialogue covering:
- Where standard English hides Japanese structure
- Key pragmatic or cultural framing differences
- Within each Gap bullet, wrap the key Japanese expression being discussed in <span class="jb">...</span> to highlight it. Include ruby tags on kanji inside the jb span.

Do NOT do line-by-line Gap analysis.

TRANSLATION FORMATTING:
- Wrap each sub-heading label in <span class="label">...</span>
- Example: <span class="label">Natural English:</span>
- Example: <span class="label">Literal English:</span>
- Example: <span class="label">The Gap:</span>

---

### BREAKDOWN

CHUNKING RULES:
- Divide each line into functional learning chunks
- A chunk = a phrase, clause, or set expression carrying a complete reusable meaning, grammar pattern, tone marker, or pragmatic move
- Use PHRASE-LEVEL granularity — do NOT treat a full line as one chunk unless it is genuinely indivisible

GRANULARITY PATTERN — apply consistently:
- Fronted topics / scene-setters → own chunk
- Time anchors and scope frames → own chunk
- Degree/manner adverbs before a predicate → own chunk
- Noun-modifying verb phrases with pedagogical weight → own chunk
- The predicate / final clause → own chunk

Granularity examples:
さっきまであんなに疲れてたのに、
→ 1. さっきまで   2. あんなに疲れてたのに、

だいたいのこと許せそう
→ 1. だいたいのこと   2. 許せそう

今日はそんな奇跡に賭ける元気、ないんだよね……
→ 1. 今日はそんな奇跡に   2. 賭ける元気、   3. ないんだよね……

SEQUENCE: Present chunks in dialogue order.

SKIP: N5-level vocabulary unless there is a meaningful disambiguation or cultural point. Skip re-entries of the same word unless it appears in a different meaning, form, or conjugation.

ANCHOR CHUNK RULE:
- Mark 3–5 especially reusable, high-value chunks per dialogue as Anchor Chunks
- Use: <span class="anchor-label">Anchor Chunk</span>

FOR EACH CHUNK, OUTPUT:
<p class="m">
  [optional: <span class="anchor-label">Anchor Chunk</span>]
  <span class="chain-term">Japanese chunk</span>
  <span class="grammar-label">(Structural grammar label)</span>
  <span class="tone-label">Pragmatic / tone function label</span>
</p>
<span class="meta-info">[Grammar / conjugation / contraction / particle note — ONLY when needed. Always in square brackets.]</span>
<span class="note-main">• Natural meaning in context.</span><br>
<span class="note-sub">• Commentary bullet one.<br>
• Commentary bullet two if needed.<br>
• Commentary bullet three if needed.</span>

NOTE-SUB FORMATTING:
- No lead-in labels (no "Why this chunk matters:" etc.) — plain bullet points only
- <br> between each bullet within the same note-sub block

META-INFO FORMATTING:
- Always wrap content in square brackets: [...]
- Example: <span class="meta-info">[終わらせる = causative of 終わる. Ichidan. ないと = shortening of ないといけない.]</span>

NOTE-CALLOUT RULE:
- Include 2–3 <span class="note-callout">...</span> blocks per card total
- Only on chunks that genuinely earn deeper treatment
- Place directly after the chunk's note-sub block, before the next <hr>

---

## DIALOGUE SCRIPT (<h1>) RULES

- Add id="dialogue-top" to the <h1> tag
- Wrap each speaker label in <a class="spk-link" href="#bdwn-{id}">Speaker N:</a> linking to that line's breakdown badge
- Refer to speakers as "Speaker 1", "Speaker 2", etc. — never A/B or other labels
- Do NOT include a situation context header above the dialogue lines
- Split each speaker line into clause-level chunks at: commas、ellipses……、dashes－、and sentence-ending punctuation。？！
- Exception: Fillers (ねえ、なんか、あのさ、てっきり、etc.) attach to the following clause rather than standing alone
- Wrap each chunk in <span class="jp-pop" data-id="{prefix}-{chunk}">...</span>
- Use the card-specific data-id prefix provided in the prompt
- Chunk IDs follow the pattern: d501-8-s1l1-a, d501-8-s1l1-b, d501-8-s2l1-a, etc.
- Speaker line anchors follow the pattern: bdwn-s1l1, bdwn-s2l1, bdwn-s1l2, etc. Increment the line number per speaker separately (s1l1, s1l2, s1l3 / s2l1, s2l2, etc.)

<h1> structure example:
<h1 id="dialogue-top">
  <a class="spk-link" href="#bdwn-s1l1">Speaker 1:</a>
  <span class="jp-pop" data-id="d501-8-s1l1-a">chunk one</span><span class="jp-pop" data-id="d501-8-s1l1-b">chunk two</span><br>
  <a class="spk-link" href="#bdwn-s2l1">Speaker 2:</a>
  <span class="jp-pop" data-id="d501-8-s2l1-a">chunk one</span>
</h1>

---

## HIDDEN POP-UP DATA BLOCKS

Place immediately after </h1>, before the first <hr>. One .pop-data div per popup chunk.

Each block contains:
- .pop-label — "Speaker N · Line N"
- .pop-trans — Translation of that clause only. No grammar notes.

data-id must exactly match the corresponding .jp-pop span.

Example:
<div class="pop-data" data-id="d501-8-s1l1-a">
  <div class="pop-label">Speaker 1 · Line 1</div>
  <div class="pop-trans">Hey, that's not what I meant at all.</div>
</div>

---

## BREAKDOWN LINE BADGES

Each speaker-line in the Breakdown starts with a badge:
<div class="bdwn-line-badge" id="bdwn-{id}">
  <span class="bdwn-spk">Speaker N</span><span class="bdwn-ln">Line N</span>
</div>

At the end of each speaker-line's final chunk, add a top-link:
<p class="ind"><a class="top-link" href="#dialogue-top">↑ Top</a></p>
<hr>

---

## WRAPPER & HEADER

Wrap the entire output in <div class="sb-wrap">...</div>.
First child inside .sb-wrap must be the model header with the placeholder DATE_PLACEHOLDER for the date:
<div class="claude-header">Claude Sonnet 4.6 · DATE_PLACEHOLDER</div>

---

## RUBY TAG RULES — ABSOLUTE

Every kanji anywhere in the HTML output — in h1, popup data, note-main, note-sub, note-callout, meta-info, jb spans, grammar labels, alternative forms — must have <ruby> + <rt> tags. No bare kanji anywhere. No parenthetical readings. No exceptions.

---

## ADDITIONAL RULES

Speaker labeling: Always "Speaker 1", "Speaker 2", etc. — never A/B or other labels.

No situation context in h1: No scene description or situation header above the dialogue lines.

Popup chunks vs. breakdown chunks:
- Popup chunks (.jp-pop in <h1>) = clause-level listening units, split at natural spoken boundaries
- Breakdown chunks = finer phrase-level pedagogical granularity
- These are intentionally different — popups are coarser; breakdown is finer

Anchor Chunks: 3–5 per card. Mark with <span class="anchor-label">Anchor Chunk</span> on the same <p class="m"> line before .chain-term

note-sub formatting: No lead-in labels. Plain • bullets only. <br> between bullets.

meta-info brackets: Always wrap content in [ ] square brackets.

note-callout: 2–3 per card maximum.

Deliberate register mixing: If a dialogue intentionally uses polite/keigo as a comic device within a casual conversation, note it in the Audit as intentional and do NOT correct it.

No romaji unless explicitly requested.

---

## REFERENCE EXAMPLE (TRIMMED)

This shows the expected structure and formatting. Follow this pattern exactly.

INPUT DIALOGUE:
ねえ、そんなに落ち込まないでよ。
うん……。でもさ、ちょっと楽しみにしてたからさ……。
分かるよー。ほら、元気出して。今日は別の楽しいことしよ？

Data-id: d515-3-

EXPECTED OUTPUT:

<div class="sb-wrap">
<div class="claude-header">Claude Sonnet 4.6 · DATE_PLACEHOLDER</div>

<h1 id="dialogue-top">
  <a class="spk-link" href="#bdwn-s1l1">Speaker 1:</a>
  <span class="jp-pop" data-id="d515-3-s1l1-a">ねえ、そんなに<ruby>落<rt>お</rt></ruby>ち<ruby>込<rt>こ</rt></ruby>まないでよ。</span><br>
  <a class="spk-link" href="#bdwn-s2l1">Speaker 2:</a>
  <span class="jp-pop" data-id="d515-3-s2l1-a">うん……。</span><span class="jp-pop" data-id="d515-3-s2l1-b">でもさ、ちょっと<ruby>楽<rt>たの</rt></ruby>しみにしてたからさ……。</span><br>
  <a class="spk-link" href="#bdwn-s1l2">Speaker 1:</a>
  <span class="jp-pop" data-id="d515-3-s1l2-a"><ruby>分<rt>わ</rt></ruby>かるよー。</span><span class="jp-pop" data-id="d515-3-s1l2-b">ほら、<ruby>元気<rt>げんき</rt></ruby><ruby>出<rt>だ</rt></ruby>して。</span><span class="jp-pop" data-id="d515-3-s1l2-c"><ruby>今日<rt>きょう</rt></ruby>は<ruby>別<rt>べつ</rt></ruby>の<ruby>楽<rt>たの</rt></ruby>しいことしよ？</span>
</h1>

<div class="pop-data" data-id="d515-3-s1l1-a">
  <div class="pop-label">Speaker 1 · Line 1</div>
  <div class="pop-trans">Hey, don't be so down about it.</div>
</div>
<div class="pop-data" data-id="d515-3-s2l1-a">
  <div class="pop-label">Speaker 2 · Line 1</div>
  <div class="pop-trans">Yeah…</div>
</div>
<div class="pop-data" data-id="d515-3-s2l1-b">
  <div class="pop-label">Speaker 2 · Line 1</div>
  <div class="pop-trans">but I was kind of looking forward to it…</div>
</div>

<hr>

<h2>【Natural Upgrade Audit (2026 / 30s–40s)】</h2>
<div class="upgrade-status">Register: Casual (タメ<ruby>口<rt>ぐち</rt></ruby>) — close friends, one comforting the other.</div>
<div class="upgrade-status">Flow &amp; Naturalness: ✓ Natural throughout.</div>
<div class="upgrade-why">
  <p class="ind">• <span class="jb">そんなに<ruby>落<rt>お</rt></ruby>ち<ruby>込<rt>こ</rt></ruby>まないでよ</span>, <span class="jb"><ruby>元気<rt>げんき</rt></ruby><ruby>出<rt>だ</rt></ruby>して</span> — natural 2026 casual adult speech.</p>
</div>
<div class="upgrade-status">Verdict: ✓ No changes needed.</div>

<hr>

<h2>【Translation】</h2>
<span class="label">Natural English:</span>
<p>Speaker 1: Hey, don't be so down about it.<br>
Speaker 2: Yeah… but I was kind of looking forward to it…<br>
Speaker 1: I know~ Come on, cheer up. Let's do something fun today instead?</p>

<span class="label">Literal English:</span>
<p>Speaker 1: Hey, that-much don't-be-depressed [I tell you].<br>
Speaker 2: Yeah… But you-know, a-little was-looking-forward-to because you-know…<br>
Speaker 1: [I] understand~ Look, energy put-out. Today-[as-for] different fun-thing let's-do?</p>

<span class="label">The Gap:</span>
<p class="ind">• <span class="jb"><ruby>元気<rt>げんき</rt></ruby><ruby>出<rt>だ</rt></ruby>して</span> — Japanese treats cheer as something you physically produce (<ruby>出<rt>だ</rt></ruby>す = to put out). English "cheer up" is vague about the mechanism; Japanese makes the speaker an active agent generating energy.</p>

<h2>【Breakdown】</h2>

<div class="bdwn-line-badge" id="bdwn-s1l1">
  <span class="bdwn-spk">Speaker 1</span><span class="bdwn-ln">Line 1</span>
</div>

<p class="m">
  <span class="anchor-label">Anchor Chunk</span>
  <span class="chain-term">そんなに<ruby>落<rt>お</rt></ruby>ち<ruby>込<rt>こ</rt></ruby>まないでよ</span>
  <span class="grammar-label">(Degree Adverb + Verb ないで + よ)</span>
  <span class="tone-label">Gentle scolding / emotional nudge</span>
</p>
<span class="meta-info">[そんなに = to that degree / that much. <ruby>落<rt>お</rt></ruby>ち<ruby>込<rt>こ</rt></ruby>む = godan, to feel down / get depressed. ないで = negative te-form request ("don't"). よ = softening sentence-ender adding warmth.]</span>
<span class="note-main">• "Hey, don't be so down about it." — warm, gently chiding.</span><br>
<span class="note-sub">• そんなに calibrates the request — not "don't be sad" but "don't be THAT sad." It acknowledges the feeling while nudging Speaker 2 to ease up.<br>
• ないでよ is softer than ないで alone or な (blunt prohibition). The よ makes it warm rather than commanding.</span>

</script>

<script>
// State
let workerUrl = localStorage.getItem('furigana_worker_url') || '';
let outputText = '';
let history = JSON.parse(localStorage.getItem('dialogue_history') || '[]');
let SYSTEM_PROMPT = '';
let currentModel = localStorage.getItem('dialogue_model') || 'claude-sonnet-4-6';

const MODEL_INFO = {
  'claude-sonnet-4-6': { label: 'Sonnet 4.6', cost: '~$3 / $15 per MTok' },
  'claude-opus-4-6': { label: 'Opus 4.6', cost: '~$15 / $75 per MTok' },
};

function init() {
  SYSTEM_PROMPT = document.getElementById('system-prompt-data').textContent;
  document.getElementById('modelSelect').value = currentModel;
  updateModelDisplay();
  updateSetupBanner();
  updateButtonState();
  renderHistory();
  document.getElementById('dialogueInput').addEventListener('input', updateButtonState);
  document.getElementById('dataId').addEventListener('input', updateButtonState);
}

function saveWorkerUrl() {
  let url = document.getElementById('workerUrl').value.trim();
  if (url.endsWith('/')) url = url.slice(0, -1);
  workerUrl = url;
  localStorage.setItem('furigana_worker_url', url);
  updateSetupBanner();
  updateButtonState();
}

function updateModelDisplay() {
  currentModel = document.getElementById('modelSelect').value;
  localStorage.setItem('dialogue_model', currentModel);
  document.getElementById('modelCost').textContent = MODEL_INFO[currentModel]?.cost || '';
}

function updateSetupBanner() {
  document.getElementById('workerUrl').value = workerUrl;
  const banner = document.getElementById('setupBanner');
  const status = document.getElementById('setupStatus');
  if (workerUrl) {
    banner.className = 'setup-banner connected';
    status.textContent = '\u2713 Connected';
    status.className = 'setup-status ok';
  } else {
    banner.className = 'setup-banner';
    status.textContent = 'Enter your Cloudflare Worker URL to get started';
    status.className = 'setup-status';
  }
}

function updateButtonState() {
  const hasDialogue = document.getElementById('dialogueInput').value.trim().length > 0;
  const hasId = document.getElementById('dataId').value.trim().length > 0;
  document.getElementById('processBtn').disabled = !workerUrl || !hasDialogue || !hasId;
}

async function callAPI(systemPrompt, userMessage) {
  const response = await fetch(workerUrl, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      model: currentModel,
      max_tokens: 16000,
      system: systemPrompt,
      messages: [{ role: 'user', content: userMessage }],
    }),
  });

  const data = await response.json();
  if (data.error) throw new Error(data.error.message || JSON.stringify(data.error));

  const text = (data.content || [])
    .filter(b => b.type === 'text')
    .map(b => b.text)
    .join('\n');

  if (!text) throw new Error('No output returned from API');

  const tokens = data.usage
    ? (data.usage.input_tokens || 0) + (data.usage.output_tokens || 0)
    : 0;

  return { text, tokens };
}

const PASS2_PROMPT = [
  'You are a Japanese language expert performing a final quality pass on Anki card HTML.',
  '',
  'Your tasks:',
  '',
  '1. RUBY TAGS: Add <ruby>kanji<rt>reading</rt></ruby> tags to EVERY kanji that does not already have them. Check everywhere: h1, h2, pop-data, note-main, note-sub, note-callout, meta-info, chain-term, upgrade-why, upgrade-status, label spans, jb spans. No bare kanji anywhere.',
  '   - Use compound readings for jukujikun: 今日→きょう, 昨日→きのう, 大人→おとな',
  '   - For mixed kanji+kana words, only wrap the kanji: 食べる→<ruby>食<rt>た</rt></ruby>べる',
  '   - 私 = わたし (not わたくし unless explicitly keigo context)',
  '   - 君 = きみ as pronoun, くん only as name suffix',
  '   - Choose readings based on context (開く: あく intransitive, ひらく transitive)',
  '   - Do NOT add ruby tags to English words or kana-only text',
  '   - Do NOT modify existing correct ruby tags',
  '',
  '2. QC FIXES:',
  '   - Remove any ruby tags wrapping English words (e.g., <ruby>Natural<rt></rt></ruby> → Natural)',
  '   - Ensure Translation sub-headings use <span class="label">Natural English:</span> format (not <h3>)',
  '   - Ensure The Gap section has <span class="jb">...</span> around key Japanese expressions being discussed',
  '   - Ensure translation lines use Speaker N: format with <br> between lines (not slash-separated)',
  '   - Verify all data-id attributes are consistent between jp-pop spans and pop-data divs',
  '   - Do NOT change the content, meaning, or commentary — only fix formatting and add ruby tags',
  '',
  'Output ONLY the corrected HTML. No explanations, no commentary.'
].join('\n');

async function processDialogue() {
  const dialogue = document.getElementById('dialogueInput').value.trim();
  const dataId = document.getElementById('dataId').value.trim();
  const notes = document.getElementById('notesInput').value.trim();
  if (!dialogue || !dataId || !workerUrl) return;

  const btn = document.getElementById('processBtn');
  const errorBox = document.getElementById('errorBox');
  const outputSection = document.getElementById('outputSection');
  const statusEl = document.getElementById('passStatus');

  btn.disabled = true;
  btn.classList.add('loading');
  errorBox.style.display = 'none';
  outputSection.style.display = 'none';
  statusEl.style.display = 'block';

  let totalTokens = 0;

  try {
    // ── PASS 1: Content + Formatting ──
    btn.textContent = 'Pass 1/2 — Generating content...';
    statusEl.textContent = 'Pass 1 of 2: Generating dialogue notes...';

    let userMessage = 'Mini-dialogue card:\n' + dialogue + '\nData-id: ' + dataId;
    if (notes) userMessage += '\nNote: ' + notes;

    const pass1 = await callAPI(SYSTEM_PROMPT, userMessage);
    totalTokens += pass1.tokens;

    statusEl.textContent = 'Pass 1 complete (' + pass1.tokens.toLocaleString() + ' tokens). Starting Pass 2...';

    // ── PASS 2: Ruby tags + QC ──
    btn.textContent = 'Pass 2/2 — Adding ruby tags & QC...';
    statusEl.textContent = 'Pass 2 of 2: Adding ruby tags and quality check...';

    const pass2 = await callAPI(PASS2_PROMPT, pass1.text);
    totalTokens += pass2.tokens;

    outputText = pass2.text;

    // ── Post-processing (code-level fixes) ──

    // Fix claude-header: correct model name and date
    const now = new Date();
    const dateStr = now.getFullYear() + '\u00B7' + String(now.getMonth() + 1).padStart(2, '0') + '\u00B7' + String(now.getDate()).padStart(2, '0');
    const modelLabel = MODEL_INFO[currentModel]?.label || 'Sonnet 4.6';
    outputText = outputText.replace(
      /<div class="claude-header">.*?<\/div>/,
      '<div class="claude-header">Claude ' + modelLabel + ' \u00B7 ' + dateStr + '</div>'
    );

    // Remove empty ruby tags on English words
    outputText = outputText.replace(/<ruby>([A-Za-z\s]+)<rt><\/rt><\/ruby>/g, '$1');

    // Ensure Translation sub-headings use label spans if model used h3
    outputText = outputText.replace(/<h3>(Natural English)<\/h3>/g, '<span class="label">$1:</span>');
    outputText = outputText.replace(/<h3>(Literal English)<\/h3>/g, '<span class="label">$1:</span>');
    outputText = outputText.replace(/<h3>(The Gap)<\/h3>/g, '<span class="label">$1:</span>');

    // Display output
    document.getElementById('outputBox').textContent = outputText;
    outputSection.style.display = 'block';
    document.getElementById('tokenInfo').textContent = totalTokens.toLocaleString() + ' tokens (2 passes)';

    statusEl.textContent = 'Done — Pass 1: ' + pass1.tokens.toLocaleString() + ' + Pass 2: ' + pass2.tokens.toLocaleString() + ' = ' + totalTokens.toLocaleString() + ' total tokens';

    addToHistory({ dataId, model: currentModel, output: outputText, tokens: totalTokens, timestamp: new Date().toISOString() });

  } catch (err) {
    errorBox.textContent = err.message;
    errorBox.style.display = 'block';
    statusEl.style.display = 'none';
  } finally {
    btn.disabled = false;
    btn.classList.remove('loading');
    btn.textContent = 'Generate Notes';
    updateButtonState();
  }
}

function copyOutput() {
  if (!outputText) return;
  navigator.clipboard.writeText(outputText);
  const btn = document.getElementById('copyBtn');
  btn.textContent = '\u2713 Copied';
  btn.classList.add('copied');
  setTimeout(() => { btn.textContent = 'Copy'; btn.classList.remove('copied'); }, 2000);
}

function addToHistory(entry) {
  history.unshift(entry);
  if (history.length > 2) history = history.slice(0, 2);
  localStorage.setItem('dialogue_history', JSON.stringify(history));
  renderHistory();
}

function clearHistory() {
  history = [];
  localStorage.setItem('dialogue_history', '[]');
  renderHistory();
}

function copyHistoryItem(index) {
  if (!history[index]) return;
  navigator.clipboard.writeText(history[index].output);
  const btn = document.getElementById('histCopy' + index);
  btn.textContent = '\u2713 Copied';
  btn.classList.add('copied');
  setTimeout(() => { btn.textContent = 'Copy'; btn.classList.remove('copied'); }, 2000);
}

function renderHistory() {
  const section = document.getElementById('historySection');
  const list = document.getElementById('historyList');
  if (history.length === 0) { section.style.display = 'none'; return; }
  section.style.display = 'block';
  list.innerHTML = history.map((h, i) => {
    const time = new Date(h.timestamp);
    const timeStr = time.toLocaleDateString() + ' ' + time.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    const preview = h.output.substring(0, 200).replace(/</g, '&lt;') + (h.output.length > 200 ? '...' : '');
    return '<div class="history-item">' +
      '<div class="history-header">' +
        '<div class="history-meta">' +
          '<span class="history-tag id">' + (h.dataId || 'unknown') + '</span>' +
          (h.tokens ? '<span class="history-tag tokens">' + h.tokens.toLocaleString() + ' tokens</span>' : '') +
        '</div>' +
        '<span class="history-time">' + timeStr + '</span>' +
      '</div>' +
      '<div class="history-output">' + preview + '</div>' +
      '<div class="history-actions">' +
        '<button class="copy-btn" id="histCopy' + i + '" onclick="copyHistoryItem(' + i + ')">Copy</button>' +
      '</div>' +
    '</div>';
  }).join('');
}

init();
</script>

</body>
</html>
